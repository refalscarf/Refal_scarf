<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee4d4">
  <meta name="description" content="Discover REFAL Scarf — Premium Quality. Follow us on social media.">
  <title>REFAL SCARF | Premium Quality</title>
  <style>
    :root { --cream:#eee4d4; --paper:#f8f4ec; --ink:#41413e; --gold:#b6a477; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      padding:28px 18px; color:var(--ink);
      background:radial-gradient(circle at 50% 20%, #f8f3e9 0, var(--cream) 70%);
      font-family:Georgia, "Times New Roman", serif;
    }
    main { width:min(100%, 430px); text-align:center; }
    .logo {
      width:min(100%, 360px); height:auto; display:block; margin:0 auto 20px;
      mix-blend-mode:multiply; border-radius:8px;
    }
    .intro { font: 12px/1.6 Arial, sans-serif; letter-spacing:.22em; color:#82765d; margin:0 0 24px; }
    .links { display:grid; gap:12px; }
    a {
      display:flex; align-items:center; justify-content:center; gap:12px;
      min-height:56px; padding:14px 18px; border:1px solid #d8cbb7;
      border-radius:4px; background:rgba(255,255,255,.58); color:var(--ink);
      text-decoration:none; font: 13px Arial, sans-serif; letter-spacing:.16em;
      transition:background .2s, transform .2s;
    }
    a:hover { background:#fffaf2; transform:translateY(-2px); }
    .symbol { color:var(--gold); font-size:17px; letter-spacing:0; }
    footer { margin-top:28px; color:#8b806d; font:10px Arial,sans-serif; letter-spacing:.22em; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="refal-logo.jpeg" alt="REFAL SCARF — Premium Quality">
    <p class="intro">CONNECT WITH REFAL</p>
    <nav class="links" aria-label="REFAL social media">
      <a href="https://www.facebook.com/share/1NaHF2z564/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer"><span class="symbol">f</span> FACEBOOK</a>
      <a href="https://www.instagram.com/refal_scarf/" target="_blank" rel="noopener noreferrer"><span class="symbol">◎</span> INSTAGRAM</a>
      <a href="https://www.tiktok.com/@refalscarf" target="_blank" rel="noopener">TikTok</a>
    </nav>
    <footer>REFAL SCARF · PREMIUM QUALITY</footer>
  </main>
</body>
</html>
